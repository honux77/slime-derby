<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>SLIME DERBY</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f23">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="SLIME DERBY 🎮" />
    <meta property="og:description" content="귀여운 슬라임들의 레이싱 게임! 슬라임을 선택해서 경주에서 우승하세요 🏆" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://honux77.github.io/slime-derby/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SLIME DERBY - 슬라임 레이싱 게임" />
    <meta name="description" content="귀여운 슬라임들의 레이싱 게임! 슬라임을 선택해서 경주에서 우승하세요 🏆" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SLIME DERBY 🎮" />
    <meta name="twitter:description" content="귀여운 슬라임들의 레이싱 게임! 슬라임을 선택해서 경주에서 우승하세요 ��" />
    <meta name="twitter:image" content="https://honux77.github.io/slime-derby/og-image.png" />
    
    <link href="https://unpkg.com/nes.css@latest/css/nes.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
</head>
<body>
<div id="app">
    <!-- Fullscreen Toggle Button -->
    <button id="fullscreen-btn" onclick="toggleFullscreen()" title="풀스크린 토글">
        <span style="font-weight: bold; font-size: 16px;">[ ]</span>
    </button>
    
    <!-- Language Toggle Button -->
    <button id="lang-btn" onclick="toggleLanguage()" title="언어 변경 / Change Language">
        <span id="lang-text">EN</span>
    </button>

    <!-- Title -->
    <div id="title-screen" class="screen active">
        <div class="title-slime-container">
            <div class="title-slime"></div>
            <div class="title-shadow"></div>
        </div>
        <h1>SLIME<br>DERBY</h1>
        <p class="subtitle" id="subtitle-text">슬라임 경주로 순서를 정하자!</p>
        <button class="btn primary blink" onclick="showSetup()" id="start-btn">PRESS START</button>
        <div class="visitor-counter">
            <img src="https://hits.sh/honux77.github.io/slime-derby.svg?label=Visitors&color=58d854&labelColor=0a0a1a" alt="Visitor Counter">
        </div>
    </div>

    <!-- Setup -->
    <div id="setup-screen" class="screen">
        <h2 id="setup-title">RACE SETUP</h2>
        <div class="setup-row">
            <span class="setup-label" id="label-total-players">총 슬라임 수</span>
            <div class="count-controls">
                <button class="count-btn" onclick="setCountMin()" style="font-size:10px;width:auto;padding:0 8px;" id="btn-min-1">MIN</button>
                <button class="count-btn" onmousedown="startCountRepeat(-1)" onmouseup="stopCountRepeat()" onmouseleave="stopCountRepeat()" ontouchstart="startCountRepeat(-1)" ontouchend="stopCountRepeat()" ontouchcancel="stopCountRepeat()">-</button>
                <input type="number" id="player-count" value="45" min="2" max="1000" oninput="setCount(this.value)">
                <button class="count-btn" onmousedown="startCountRepeat(1)" onmouseup="stopCountRepeat()" onmouseleave="stopCountRepeat()" ontouchstart="startCountRepeat(1)" ontouchend="stopCountRepeat()" ontouchcancel="stopCountRepeat()">+</button>
                <button class="count-btn" onclick="setCountMax()" style="font-size:10px;width:auto;padding:0 8px;" id="btn-max-1">MAX</button>
            </div>
        </div>
        <div class="setup-row">
            <span class="setup-label" id="label-racing-players">레이싱 참가 슬라임 수</span>
            <div class="count-controls">
                <button class="count-btn" onclick="setRaceCountMin()" style="font-size:10px;width:auto;padding:0 8px;" id="btn-min-2">MIN</button>
                <button class="count-btn" onmousedown="startRaceCountRepeat(-1)" onmouseup="stopRaceCountRepeat()" onmouseleave="stopRaceCountRepeat()" ontouchstart="startRaceCountRepeat(-1)" ontouchend="stopRaceCountRepeat()" ontouchcancel="stopRaceCountRepeat()">-</button>
                <input type="number" id="race-count" value="6" min="2" max="15" oninput="setRaceCount(this.value)">
                <button class="count-btn" onmousedown="startRaceCountRepeat(1)" onmouseup="stopRaceCountRepeat()" onmouseleave="stopRaceCountRepeat()" ontouchstart="startRaceCountRepeat(1)" ontouchend="stopRaceCountRepeat()" ontouchcancel="stopRaceCountRepeat()">+</button>
                <button class="count-btn" onclick="setRaceCountMax()" style="font-size:10px;width:auto;padding:0 8px;" id="btn-max-2">MAX</button>
            </div>
        </div>
        <div class="setup-row" id="draw-notice" style="display:none; margin-top:-8px; margin-bottom:4px;">
            <span class="setup-label"></span>
            <div style="font-size:9px; color:#ffdd00; line-height:1.5;" id="draw-notice-text">
                ※ 랜덤 추첨 화면이 표시됩니다
            </div>
        </div>
        <div class="setup-row">
            <span class="setup-label"></span>
            <label class="sd-checkbox">
                <input type="checkbox" id="use-names" onchange="buildPlayerInputs();saveSetup()">
                <span class="sd-check-box"></span>
                <span id="label-use-names">이름 입력</span>
            </label>
        </div>
        <div class="setup-row">
            <span class="setup-label"></span>
            <label class="sd-checkbox">
                <input type="checkbox" id="use-nes-chars" onchange="saveSetup()">
                <span class="sd-check-box"></span>
                <span>NIN..DO</span>
            </label>
        </div>
        <div class="setup-row">
            <span class="setup-label"></span>
            <label class="sd-checkbox">
                <input type="checkbox" id="early-finish" checked onchange="saveSetup()">
                <span class="sd-check-box"></span>
                <span id="label-early-finish">조기 종료</span>
            </label>
        </div>
        <div class="player-list" id="player-list"></div>
        <div class="setup-row">
            <span class="setup-label" id="label-race-time">레이스 시간</span>
            <div class="count-controls">
                <button class="count-btn" onclick="setTimeMin()" style="font-size:10px;width:auto;padding:0 8px;" id="btn-min-3">MIN</button>
                <button class="count-btn" onmousedown="startTimeRepeat(-1)" onmouseup="stopTimeRepeat()" onmouseleave="stopTimeRepeat()" ontouchstart="startTimeRepeat(-1)" ontouchend="stopTimeRepeat()" ontouchcancel="stopTimeRepeat()">-</button>
                <input type="number" id="time-input" value="10" min="3" max="60" oninput="setTime(this.value)">
                <button class="count-btn" onmousedown="startTimeRepeat(1)" onmouseup="stopTimeRepeat()" onmouseleave="stopTimeRepeat()" ontouchstart="startTimeRepeat(1)" ontouchend="stopTimeRepeat()" ontouchcancel="stopTimeRepeat()">+</button>
                <button class="count-btn" onclick="setTimeMax()" style="font-size:10px;width:auto;padding:0 8px;" id="btn-max-3">MAX</button>
                <span class="unit">SEC</span>
            </div>
        </div>
        <div style="display:flex;gap:12px;margin-top:12px">
            <button class="btn" onclick="resetSetup()" style="font-size:10px" id="btn-reset">RESET</button>
            <button class="btn primary" onclick="startRace()" style="font-size:14px" id="btn-start-race">START RACE!</button>
        </div>
    </div>

    <!-- Draw (selection) -->
    <div id="select-screen" class="screen">
        <h2 id="draw-title">RANDOM DRAW</h2>
        <p class="draw-sub" id="draw-subtitle">총 <span id="draw-total">0</span>명 중 <span id="draw-selected" style="color:var(--green)">0</span>명 선발!</p>
        <div class="draw-grid" id="draw-grid"></div>
        <button class="btn primary" onclick="beginRace()" style="margin-top:12px;font-size:14px" id="draw-start-btn">START RACE!</button>
    </div>

    <!-- Game -->
    <div id="game-screen" class="screen">
        <canvas id="race-canvas"></canvas>
    </div>

    <!-- Results -->
    <div id="result-screen" class="screen">
        <h2>FINISH!</h2>
        <div id="finish-snapshot" style="margin-bottom: 16px;"></div>
        <div class="results-list" id="results-list"></div>
        <div style="margin: 12px 0; font-size: 10px; color: #888;">
            Enjoyed the game? <a href="https://buymeacoffee.com/honux77o" target="_blank" style="color: #FFDD00; text-decoration: none; font-weight: bold;">☕ Buy me a coffee!</a>
        </div>
        <div class="btn-group">
            <button class="btn" onclick="downloadResults()"><span class="btn-full">📥 DOWNLOAD</span><span class="btn-mobile">📥</span></button>
            <button class="btn" onclick="showSetup()">SETUP</button>
            <button class="btn primary" onclick="startRace()">REMATCH</button>
        </div>
    </div>
</div>


<!-- Scripts -->
<script src="js/translations.js"></script>
<script src="js/constants.js"></script>
<script src="js/audio.js"></script>
<script src="js/rendering.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>

</body>
</html>
